[project]
name = "ruc-ov-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "boto3>=1.42.57",
    "chromadb",
    "gritlm>=1.0.2",
    "lightrag-hku",
    "igraph>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.16",
    "langchain-openai>=1.1.10",
    "langchain-text-splitters>=1.1.1",
    "litellm>=1.81.16",
    "modora-backend[ocr-cpu]",
    "numpy>=2.2.0,<2.3",
    "openai>=2.24.0",
    "openviking",
    "pybind11>=3.0.2",
    "pymupdf>=1.27.1",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.2",
    "setuptools>=82.0.1",
    "sqlalchemy>=2.0.47",
    "tiktoken>=0.12.0",
    "torch>=2.5.1",
    "tqdm>=4.67.3",
    "transformers>=4.57.3",
    "docling>=2.90.0",
    "pypdf>=6.10.2",
    "pdfplumber>=0.11.9",
]

[tool.uv.workspace]
members = [
    "OpenViking",
    "modora/MoDora-backend",
]

[tool.uv.sources]
openviking = { workspace = true }
modora-backend = { workspace = true }
lightrag-hku = { path = "lightrag" }
