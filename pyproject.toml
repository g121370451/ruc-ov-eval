[project]
name = "ruc-ov-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "modora-backend",
    "numpy>=2.2.0,<2.3",
    "openai>=2.24.0",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.2",
    "requests>=2.31,<3",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.3",
    "pypdf>=6.10.2",
    "pdfplumber>=0.11.9",
    "protobuf>=3.20,<3.21",
    "python-docx",
]

[tool.uv.workspace]
members = [
    "modora/MoDora-backend",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv.sources]
modora-backend = { workspace = true }
