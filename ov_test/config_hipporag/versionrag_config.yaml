project_name: "RAG_Benchmark"
dataset_name: "VersionRAG"

adapter:
  module: "src.adapters.versionrag_adapter"
  class_name: "VersionRAGAdapter"

store:
  type: "hipporag"
  hipporag_config:
    llm_name: "doubao-seed-2-0-pro-260215"
    llm_base_url: "${LLM_BASE_URL}"
    llm_api_key: ""
    embedding_model_name: "${EMBEDDING_MODEL_NAME}"
    embedding_base_url: "${EMBEDDING_BASE_URL}"
    embedding_api_key: "${EMBEDDING_API_KEY}"
    use_langchain: true
    chunk_size: 512
    chunk_overlap: 50
    retrieval_top_k: 5
    qa_top_k: 5
    temperature: 0

execution:
  max_workers: 4
  ingest_workers: 4
  retrieval_topk: 5
  max_queries: null

paths:
  raw_data: "Data/{dataset_name}/data/test/evaluation_set.csv"
  doc_output_dir: "Data/{dataset_name}/hipporag_global/processed_docs"
  vector_store: "Data/{dataset_name}/hipporag_global/store_index"
  output_dir: "Output/{dataset_name}/hipporag_global/experiment_0001"
  log_file: "Output/{dataset_name}/hipporag_global/experiment_0001/benchmark.log"

llm:
  model: "doubao-seed-2-0-pro-260215"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: ""
