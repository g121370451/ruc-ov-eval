project_name: "RAG_Benchmark"

# ===========修改配置================
dataset_name: "LoongLegal"

adapter:
  module: "src.adapters.loong_legal_adapter"
  class_name: "LoongLegalAdapter"

store:
  type: "DeepRead"
  enable_vector: true
  enable_hybrid: false
  enable_semantic: false
  neighbor_window: "1,-1"
  max_rounds: 50
  # 本地调试用：用 pymupdf 替代 PaddleOCR（仅适用于数字原生 PDF）
  # 服务器上有 GPU 时改为 false
  use_pymupdf: true

execution:
  max_workers: 10         # LLM 生成任务的并发数
  ingest_workers: 1      # 数据入库任务的并发数
  retrieval_topk: 2     # 检索 Top-K（Legal 任务需多文档理解，适当放大）
  max_queries: null      # 最大查询数，null 表示全部查询
  skip_ingestion: true
# ==================================

paths:
  raw_data: "Data/Loong/loong.jsonl"
  doc_output_dir: "Data/Loong/DeepRead/global/legal_processed_docs"
  vector_store: "Data/Loong/DeepRead/global/legal_viking_store"
  output_dir: "Output/LoongLegal/deepread_global_experiment"


llm:
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "68e15b71-7673-4734-bf7a-01bb80a127ea"
