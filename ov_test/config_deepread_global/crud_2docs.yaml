project_name: "RAG_Benchmark"

# ===========修改配置================
dataset_name: "CRUD"

adapter:
  module: "src.adapters.crud_adapter"
  class_name: "CrudAdapter"
  # 可选参数：subset ("1doc" | "2docs" | "3docs" | "all")
  # 默认 "2docs"

store:
  type: "DeepRead"
  enable_vector: true
  enable_hybrid: false
  enable_semantic: false
  neighbor_window: "1,-1"
  max_rounds: 50
  # 本地调试用：用 pymupdf 替代 PaddleOCR（仅适用于数字原生 PDF）
  # 服务器上有 GPU 时改为 false
  use_pymupdf: true

execution:
  max_workers: 10
  ingest_workers: 1
  retrieval_topk: 15
  max_queries: 100
  skip_ingestion: false

paths:
  raw_data: "Data/{dataset_name}/crud_split/split_merged.json"
  doc_output_dir: "Data/{dataset_name}/DeepRead/global/processed_docs"
  vector_store: "Data/{dataset_name}/DeepRead/global/store_index"
  output_dir: "Output/{dataset_name}/deepread_global_experiment"

llm:
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "68e15b71-7673-4734-bf7a-01bb80a127ea"
