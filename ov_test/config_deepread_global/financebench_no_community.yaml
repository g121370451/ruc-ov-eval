project_name: "RAG_Benchmark"
dataset_name: "FinanceBench"

adapter:
  module: "src.adapters.finance_bench_adapter"
  class_name: "FinanceBenchAdapter"

store:
  type: "DeepRead"
  enable_vector: false
  enable_hybrid: false
  enable_semantic: false
  neighbor_window: "1,-1"
  max_rounds: 50
  use_pymupdf: true

  # Keep the three DeepRead improvements, but disable graph/community routing.
  source_header_enabled: true
  enable_session_pagination: true
  enable_read_label_dedup: true
  agent_topk_max: 10
  pagination_candidate_limit: 50
  enable_retrieval_stagnation_hint: true
  retrieval_stagnation_threshold: 3
  enable_document_graph: false

  agent_instructions:
    - "FinanceBench document names usually encode the company, fiscal year, and report type. Verify those attributes before relying on a candidate document."
    - "Before answering, check that dates, units, and financial definitions come from the same intended document and reporting period."

execution:
  max_workers: 3
  ingest_workers: 3
  retrieval_topk: 1
  max_queries: null
  skip_ingestion: false

paths:
  raw_data: "Data/{dataset_name}/data/financebench_open_source.jsonl"
  doc_output_dir: "Data/{dataset_name}/DeepRead/global_no_community/processed_docs"
  vector_store: "Data/{dataset_name}/DeepRead/global_no_community/store_index"
  output_dir: "Output/{dataset_name}/deepread_global_no_community"

llm:
  model: "${LLM_MODEL}"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
