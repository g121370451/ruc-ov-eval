project_name: "RAG_Benchmark"
dataset_name: "FinanceBench"

adapter:
  module: "src.adapters.finance_bench_adapter"
  class_name: "FinanceBenchAdapter"

store:
  type: "DeepRead"
  enable_vector: true
  enable_hybrid: false
  enable_semantic: false
  neighbor_window: "1,-1"
  max_rounds: 50
  use_pymupdf: true

  # Compatibility settings for the zqy-DeepRead branch behavior.
  source_header_enabled: true
  enable_session_pagination: true
  enable_read_label_dedup: false
  agent_topk_max: 10
  pagination_candidate_limit: 50
  enable_retrieval_stagnation_hint: true
  retrieval_stagnation_threshold: 3
  enable_document_graph: false
  embedding_api_key: "${EMBEDDING_API_KEY}"
  embedding_base_url: "${EMBEDDING_BASE_URL}"
  embedding_model: "${EMBEDDING_MODEL_NAME}"

  agent_instructions:
    - "FinanceBench document names usually encode the company, fiscal year, and report type. After locating a candidate document, verify those attributes against the question using the source-document node or directory before relying on its evidence."
    - "If a directory title clearly matches the requested financial topic, prefer read_section on that node. Otherwise continue with document-scoped retrieval using the candidate doc_id."
    - "For global regex retrieval, first locate the document, then run a shorter phrase or metric query with scope=doc."
    - "Before answering, check that dates, guidance periods, units, and financial definitions come from the same intended document and reporting period."

execution:
  max_workers: 3
  ingest_workers: 1
  retrieval_topk: 1
  max_queries: null
  skip_ingestion: false

paths:
  raw_data: "Data/{dataset_name}/data/financebench_open_source.jsonl"
  doc_output_dir: "Data/{dataset_name}/DeepRead/global_original/processed_docs"
  vector_store: "Data/{dataset_name}/DeepRead/global_original/store_index"
  output_dir: "Output/{dataset_name}/deepread_global_original"

llm:
  model: "${LLM_MODEL}"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
