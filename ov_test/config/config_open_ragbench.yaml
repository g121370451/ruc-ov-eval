project_name: "RAG_Benchmark"

# =========== 数据集配置 ================
dataset_name: "open_ragbench"

adapter:
  module: "src.adapters.open_ragbench_adapter"
  class_name: "OpenRAGBenchAdapter"

execution:
  max_workers: 5         # LLM 生成任务的并发数
  ingest_workers: 1      # 数据入库任务的并发数（提交到 OV 的并发数）
  retrieval_topk: 5
  max_queries: null        # 最大查询数，null 表示全部查询
# ======================================

paths:
  raw_data: "Data/open_ragbench/pdf/arxiv"
  doc_output_dir: "Data/open_ragbench/processed_docs"
  vector_store: "Data/open_ragbench/store_index"
  output_dir: "Output/open_ragbench/openviking_global/experiment_0001"
  log_file: "Output/open_ragbench/openviking_global/experiment_0001/benchmark.log"


llm:
  model: "${LLM_MODEL}"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
