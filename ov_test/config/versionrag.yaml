project_name: "RAG_Benchmark"

# ===========修改配置================
dataset_name: "VersionRAG"

adapter:
  module: "src.adapters.versionrag_adapter"
  class_name: "VersionRAGAdapter"

execution:
  max_workers: 5         # LLM 生成任务的并发数
  ingest_workers: 1      # 数据入库任务的并发数
  retrieval_topk: 5
  max_queries: null      # 最大查询数，null表示全部查询
# ==================================

paths:
  raw_data: "Data/{dataset_name}/data/test/evaluation_set.csv"
  doc_output_dir: "Data/{dataset_name}/processed_docs"
  vector_store: "Data/{dataset_name}/store_index"
  output_dir: "Output/{dataset_name}/openviking_global/experiment_0001"
  log_file: "Output/{dataset_name}/openviking_global/experiment_0001/benchmark.log"


llm:
  model: "${LLM_MODEL}"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
