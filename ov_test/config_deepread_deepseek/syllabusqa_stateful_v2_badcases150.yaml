project_name: "RAG_Benchmark"
dataset_name: "SyllabusQA"

adapter:
  module: "src.adapters.syllabusqa_adapter"
  class_name: "SyllabusQAAdapter"

store:
  type: "DeepRead"
  agent_llm:
    model: "${DEEPSEEK_MODEL}"
    base_url: "${DEEPSEEK_BASE_URL}"
    api_key: "${DEEPSEEK_API_KEY}"
    reasoning_effort: "high"
    request_timeout: 600
  enable_vector: true
  enable_hybrid: false
  enable_semantic: false
  neighbor_window: "1,-1"
  max_rounds: 50
  use_pymupdf: true
  source_header_enabled: true
  enable_session_pagination: true
  agent_topk_max: 10
  pagination_candidate_limit: 50
  enable_retrieval_stagnation_hint: true
  retrieval_stagnation_threshold: 3
  embedding_api_key: "${EMBEDDING_API_KEY}"
  embedding_base_url: "${EMBEDDING_BASE_URL}"
  embedding_model: "${EMBEDDING_MODEL_NAME}"
  agent_instructions:
    - "A SyllabusQA question usually names the target syllabus or course. First search the exact syllabus identifier and normalized variants with underscores, hyphens, colons, and punctuation replaced by spaces; verify the Source Document node before using syllabus content."
    - "After identifying the target syllabus, use document-scoped BM25, regex, or vector search. Do not answer from a different course merely because its policy wording is similar."
    - "For dates, exam numbers, grading percentages, book titles, room numbers, and instructor names, use regex_search with short distinctive expressions when BM25 does not return the exact field."
    - "If repeated full-corpus searches keep returning the same wrong courses, change the routing query to the shortest distinctive course identifier and inspect newly paginated documents instead of paraphrasing the policy question again."

execution:
  max_workers: 10
  ingest_workers: 4
  retrieval_topk: 1
  max_queries: null
  # 首次运行自动入库并继续执行坏例；重跑时通过 pipeline records/文档产物断点续传。
  skip_ingestion: false

paths:
  raw_data: "Data/{dataset_name}"
  doc_output_dir: "Data/{dataset_name}/DeepRead/global_stateful_v2/processed_docs"
  vector_store: "Data/{dataset_name}/DeepRead/global_stateful_v2/store_index"
  task_cases: "ov_test/config_deepread_deepseek/case_sets/syllabusqa_retrieval_badcases_seed20260812_n150_stable.json"
  output_dir: "Output/{dataset_name}/deepread_global_stateful_v2_deepseek_badcases150"

llm:
  model: "${LLM_MODEL}"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
