project_name: "RAG_Benchmark"
dataset_name: "mudabench_complex"

adapter:
  module: "src.adapters.mudabench_adapter"
  class_name: "MuDABenchAdapter"

store:
  type: "graphrag"
  graphrag:
    indexing_method: "standard"
    query_mode: "drift"
    community_level: 2
    response_type: "Multiple Paragraphs"
    concurrent_requests: 8
    show_index_progress: true
    progress_mininterval: 0.5
    max_context_tokens: 12000
    cache_enabled: true
    context_block_max_chars: 12000
    chunking:
      type: "tokens"
      size: 1200
      overlap: 100
      encoding_model: "o200k_base"
    completion:
      model_provider: "openai"
    embedding:
      model_provider: "openai"
    embed_text:
      # DRIFT 只使用实体描述和社区报告向量；服务端单请求最多 10 条 input。
      names:
        - "entity_description"
        - "community_full_content"
      batch_size: 10
      batch_max_tokens: 8191
    drift_search:
      data_max_tokens: 12000
      reduce_temperature: 0
      concurrency: 8
      drift_k_followups: 20
      primer_folds: 5
      primer_llm_max_tokens: 12000
      n_depth: 3
      local_search_text_unit_prop: 0.9
      local_search_community_prop: 0.1
      local_search_top_k_mapped_entities: 10
      local_search_top_k_relationships: 10
      local_search_max_data_tokens: 12000

execution:
  # GraphRAG 内部处理并发为 8；外层查询保持串行，避免并发倍增。
  max_workers: 1
  ingest_workers: 1
  retrieval_topk: 10
  max_queries: null
  skip_ingestion: false

paths:
  raw_data: "Data/OVWikiBenchmark/datasets/MuDABenchComplex/complex.json"
  # Simple/Complex 共用同一份 589-PDF 语料和 GraphRAG 索引。
  doc_output_dir: "Data/OVWikiBenchmark/runtime/mudabench_589/graphrag/processed_docs"
  vector_store: "Data/OVWikiBenchmark/runtime/mudabench_589/graphrag/drift_store"
  output_dir: "Output/OVWikiBenchmark/{dataset_name}/graphrag_drift"
  log_file: "Output/OVWikiBenchmark/{dataset_name}/graphrag_drift/benchmark.log"

llm:
  model: "${VLM_MODEL}"
  temperature: 0
  base_url: "${VLM_BASE_URL}"
  api_key: "${VLM_API_KEY}"

