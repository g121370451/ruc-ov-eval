project_name: "RAG_Benchmark"
dataset_name: "VersionRAG"

adapter:
  module: "src.adapters.versionrag_adapter"
  class_name: "VersionRAGAdapter"

store:
  type: "sql_agent"
  sql_agent_config:
    llm_model: "doubao-seed-2-0-pro-260215"
    llm_base_url: "${LLM_BASE_URL}"
    llm_api_key: ""
    chunk_size: 800
    chunk_overlap: 100
    sentence_aware_chunk: true
    chunk_min_size: 200
    chunk_max_size: 800
    max_iterations: 15
    verbose: false

execution:
  max_workers: 8
  ingest_workers: 8
  retrieval_topk: 30
  max_queries: null
  explain_not_mentioned: true

paths:
  raw_data: "Data/{dataset_name}/data/test/evaluation_set.csv"
  doc_output_dir: "Data/{dataset_name}/sql_agent/processed_docs"
  vector_store: "Data/{dataset_name}/sql_agent/store_index"
  output_dir: "Output/{dataset_name}/sql_agent_global/experiment_0001_doubao"
  log_file: "Output/{dataset_name}/sql_agent_global/experiment_0001_doubao/benchmark.log"

llm:
  model: "doubao-seed-2-0-pro-260215"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: ""
