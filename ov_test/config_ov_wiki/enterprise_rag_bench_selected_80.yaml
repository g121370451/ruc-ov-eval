project_name: "RAG_Benchmark"
dataset_name: "enterprise_rag_bench_selected_80"
adapter:
  module: "src.adapters.enterprise_rag_bench_adapter"
  class_name: "EnterpriseRAGBenchAdapter"
store:
  type: "viking"
execution:
  max_workers: 4
  ingest_workers: 4
  retrieval_topk: 5
  max_queries: null
  skip_ingestion: false
paths:
  raw_data: "Data/OVWikiBenchmark/datasets/EnterpriseRAGBenchSelected80/questions_selected_80.jsonl"
  doc_output_dir: "Data/OVWikiBenchmark/runtime/enterprise_rag_bench_selected_80/processed_docs"
  vector_store: "Data/OVWikiBenchmark/runtime/enterprise_rag_bench_selected_80/viking_store"
  output_dir: "Output/OVWikiBenchmark/{dataset_name}/viking_global"
  log_file: "Output/OVWikiBenchmark/{dataset_name}/viking_global/benchmark.log"
llm:
  model: "${VLM_MODEL}"
  temperature: 0
  base_url: "${VLM_BASE_URL}"
  api_key: "${VLM_API_KEY}"