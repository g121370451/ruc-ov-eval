project_name: "RAG_Benchmark"
dataset_name: "mudabench_simple"
adapter:
  module: "src.adapters.mudabench_adapter"
  class_name: "MuDABenchAdapter"
store:
  type: "viking"
execution:
  max_workers: 4
  ingest_workers: 4
  retrieval_topk: 5
  max_queries: null
  skip_ingestion: false
paths:
  raw_data: "Data/OVWikiBenchmark/datasets/MuDABenchSimple/simple.json"
  doc_output_dir: "Data/OVWikiBenchmark/runtime/mudabench_589/processed_docs"
  vector_store: "Data/OVWikiBenchmark/runtime/mudabench_589/viking_store"
  output_dir: "Output/OVWikiBenchmark/{dataset_name}/viking_global"
  log_file: "Output/OVWikiBenchmark/{dataset_name}/viking_global/benchmark.log"
llm:
  model: "${VLM_MODEL}"
  temperature: 0
  base_url: "${VLM_BASE_URL}"
  api_key: "${VLM_API_KEY}"