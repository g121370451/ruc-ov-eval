project_name: "RAG_Benchmark"
dataset_name: "scholarqa_multi_valid_101"
adapter:
  module: "src.adapters.scholarqa_multi_adapter"
  class_name: "ScholarQAMultiAdapter"
store:
  type: "viking"
execution:
  max_workers: 4
  ingest_workers: 4
  retrieval_topk: 5
  max_queries: null
  skip_ingestion: false
paths:
  raw_data: "Data/OVWikiBenchmark/datasets/ScholarQAMultiValid101/scholarqa_multi_valid_101.json"
  doc_output_dir: "Data/OVWikiBenchmark/runtime/scholarqa_multi_valid_101/processed_docs"
  vector_store: "Data/OVWikiBenchmark/runtime/scholarqa_multi_valid_101/viking_store"
  output_dir: "Output/OVWikiBenchmark/{dataset_name}/viking_global"
  log_file: "Output/OVWikiBenchmark/{dataset_name}/viking_global/benchmark.log"
llm:
  model: "${VLM_MODEL}"
  temperature: 0
  base_url: "${VLM_BASE_URL}"
  api_key: "${VLM_API_KEY}"