project_name: RAG_Benchmark
dataset_name: VersionRAG_1
adapter:
  module: src.adapters.versionrag_adapter
  class_name: VersionRAGAdapter
  grouping_mode: qa_doc_mapping
execution:
  grouping_mode: doc_paths
  max_workers: 2
  ingest_workers: 2
  retrieval_topk: 5
  max_queries: null
  auto_output_dir: false
paths:
  raw_data: Data/{dataset_name}/data/test/evaluation_set.csv
  doc_output_dir: Data/{dataset_name}/modora_per_doc/prepared_docs
  vector_store: Data/{dataset_name}/modora_per_doc/stores
  output_dir: Output/{dataset_name}/modora_per_doc/experiment_0001
  log_file: Output/{dataset_name}/modora_per_doc/experiment_0001/benchmark.log
store:
  type: modora
  modora_backend_path: modora/MoDora-backend
  docs_dir: Data/{dataset_name}/modora_per_doc/docs
  cache_dir: Data/{dataset_name}/modora_per_doc/cache
  chroma_persist_path: Data/{dataset_name}/modora_per_doc/stores
  ingest_mode: python
  preload_library: false
  share_library_cache: true
  force_full_library_retrieval: true
  serial_queries: false
  run_ocr: true
  run_build_tree: true
  resume: true
  overwrite: false
  delete_mode: cache_only
  delete_vector_index: true
  materialize_clean_unreferenced_pdfs: true
  ocr_batch_size: 1
  ocr_text_recognition_batch_size: 1
  component_workers: 2
  get_component_timeout_s: 300
  build_tree_concurrency: 2
  enable_vector_search: true
  enable_rerank: false
  embedding_api_base: ${EMBEDDING_BASE_URL}
  embedding_api_key: ${EMBEDDING_API_KEY}
  embedding_model_name: ${EMBEDDING_MODEL}
  embedding_index_batch_size: 32
  embedding_index_concurrency: 16
  rerank_api_base: ""
  rerank_api_key: ""
  rerank_model_name: ""
  ocr_model: pdf_text
  ocr_device: cpu
  ocr_lang: en
  allow_pdf_text_fallback: false
  query_trace_logging: false
  qa_include_schema_in_reasoning: true
  qa_schema_scope: evidence_docs
  qa_enable_fallback: true
  text_only_mode: true
  enrich_non_text_components: false
  visual_level_generation: false
  visual_relevance_check: false
  visual_reasoning: false
  remote_llm_max_concurrency: 1
  remote_llm_per_query_concurrency: 1
  remote_llm_max_attempts: 6
  remote_llm_base_delay_s: 2.0
  remote_llm_max_delay_s: 30.0
  model_instances:
    JUDGE_LLM:
      type: remote
      model: ${VLM_MODEL}
      base_url: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
  ui_settings:
    schemaVersion: 3
    pipelines:
      enrichment:
        modelInstance: JUDGE_LLM
      levelGenerator:
        modelInstance: JUDGE_LLM
      metadataGenerator:
        modelInstance: JUDGE_LLM
      retriever:
        modelInstance: JUDGE_LLM
      qaService:
        modelInstance: JUDGE_LLM
  text_extract_workers: 2
  pdf_text_empty_policy: warn
llm:
  model: ${VLM_MODEL}
  temperature: 0
  base_url: ${VLM_BASE_URL}
  api_key: ${VLM_API_KEY}
