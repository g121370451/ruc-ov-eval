project_name: "RAG_Benchmark"

# =========修改配置=========
dataset_name: "FinanceBench"

adapter:
  module: "src.adapters.finance_bench_adapter"
  class_name: "FinanceBenchAdapter"

store:
  type: "KohakuRAG"
  embedding_dimension: "${EMBEDDING_DIMENSION}"
  parent_depth: 1
  child_depth: 0
  deduplicate_retrieval: true
  rerank_strategy: null  # null | "frequency" | "score" | "combined"
  paragraph_embedding_mode: "averaged"
  planner_max_queries: 3

execution:
  max_workers: 6
  ingest_workers: 8
  retrieval_topk: 5
  max_queries: null
# =========================

paths:
  raw_data: "Data/{dataset_name}/data/financebench_open_source.jsonl"
  doc_output_dir: "Data/{dataset_name}/KohakuRAG/processed_docs"
  vector_store: "Data/{dataset_name}/KohakuRAG/store_index"
  output_dir: "Output/{dataset_name}/kohaku_experiment"
  log_file: "Output/{dataset_name}/kohaku_experiment/benchmark.log"

llm:
  model: "${VLM_MODEL}"
  temperature: 0
  base_url: "${VLM_BASE_URL}"
  api_key: "${VLM_API_KEY}"
