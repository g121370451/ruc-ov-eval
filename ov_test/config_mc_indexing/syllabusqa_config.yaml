project_name: "RAG_Benchmark"
dataset_name: "SyllabusQA"

adapter:
  module: "src.adapters.syllabusqa_adapter"
  class_name: "SyllabusQAAdapter"

store:
  type: "mc_indexing"
  mc_indexing_config:
    method: "MC-indexing"
    retriever: "bm25"
    view_workers: 1
    max_context_chars: 12000
    context_block_chars: 2000
    cache_views: true
    return_source_text: true
    allow_dense_fallback: false

execution:
  max_workers: 10
  ingest_workers: 1
  retrieval_topk: 5
  max_queries: null
  auto_output_dir: true

paths:
  raw_data: "Data/{dataset_name}"
  doc_output_dir: "Data/{dataset_name}/mc_indexing/processed_docs"
  vector_store: "Data/{dataset_name}/mc_indexing/store_index"
  output_dir: "Output/{dataset_name}/mc_indexing/experiment_0001"
  log_file: "Output/{dataset_name}/mc_indexing/experiment_0001/benchmark.log"

llm:
  model: "${LLM_MODEL}"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
