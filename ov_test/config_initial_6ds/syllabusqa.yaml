project_name: "RAG_Benchmark"

# initial 基线（fb8a301 + DeepRead 7fe3ba2）：SyllabusQA
dataset_name: "SyllabusQA"

adapter:
  module: "src.adapters.syllabusqa_adapter"
  class_name: "SyllabusQAAdapter"

store:
  type: "DeepRead"
  enable_vector: true
  enable_hybrid: false
  enable_semantic: false
  neighbor_window: "1,-1"
  max_rounds: 50
  use_pymupdf: true
  embedding_api_key: "${EMBEDDING_API_KEY}"
  embedding_base_url: "${EMBEDDING_BASE_URL}"
  embedding_model: "${EMBEDDING_MODEL}"

execution:
  max_workers: 9
  ingest_workers: 1
  retrieval_topk: 1
  max_queries: null
  skip_ingestion: true
# ==================================

paths:
  raw_data: "Data/{dataset_name}"
  # use test.csv for test split
  doc_output_dir: "Data/{dataset_name}/DeepRead/global/processed_docs"
  vector_store: "Data/{dataset_name}/DeepRead/global/store_index"
  output_dir: "Output/{dataset_name}/deepread_global_initial_${MODEL_TAG}"

llm:
  model: "${LLM_MODEL}"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"

judge:
  model: "${JUDGE_MODEL}"
  temperature: 0
  base_url: "${JUDGE_BASE_URL}"
  api_key: "${JUDGE_API_KEY}"
