project_name: "RAG_Benchmark"

# initial 基线（fb8a301 + DeepRead 7fe3ba2）：FinanceBench
# 答题模型由 LLM_* 环境变量注入（ds / doubao 两阶段），评审固定 JUDGE_*，embedding 用 EMBEDDING_*
dataset_name: "FinanceBench"

adapter:
  module: "src.adapters.finance_bench_adapter"
  class_name: "FinanceBenchAdapter"

store:
  type: "DeepRead"
  enable_vector: true
  enable_hybrid: false
  enable_semantic: false
  neighbor_window: "1,-1"
  max_rounds: 50
  # 本地调试用：用 pymupdf 替代 PaddleOCR（仅适用于数字原生 PDF）
  # 服务器上有 GPU 时改为 false
  use_pymupdf: true
  embedding_api_key: "${EMBEDDING_API_KEY}"
  embedding_base_url: "${EMBEDDING_BASE_URL}"
  embedding_model: "${EMBEDDING_MODEL}"

execution:
  max_workers: 3
  ingest_workers: 1
  retrieval_topk: 1
  max_queries: null
  skip_ingestion: true
# ==================================

paths:
  raw_data: "Data/{dataset_name}/data/financebench_open_source.jsonl"
  doc_output_dir: "Data/{dataset_name}/DeepRead/global/processed_docs"
  vector_store: "Data/{dataset_name}/DeepRead/global/store_index"
  output_dir: "Output/{dataset_name}/deepread_global_initial_${MODEL_TAG}"

llm:
  model: "${LLM_MODEL}"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"

judge:
  model: "${JUDGE_MODEL}"
  temperature: 0
  base_url: "${JUDGE_BASE_URL}"
  api_key: "${JUDGE_API_KEY}"
