project_name: "RAG_Benchmark"
dataset_name: "VersionRAG"

adapter:
  module: "src.adapters.versionrag_adapter"
  class_name: "VersionRAGAdapter"

execution:
  max_workers: 10
  ingest_workers: 10
  retrieval_topk: 5
  max_queries: null
  ingest_mode: "directory"
  retrieval_instruction: ""
  use_vikingbot: false
  skip_ingestion: true

paths:
  dataset_path: "datasets/{dataset_name}/data/test/evaluation_set.csv"
  doc_output_dir: "naive_storage/{dataset_name}/{dataset_name}_processed_docs"
  vector_store: "naive_storage/{dataset_name}/{dataset_name}_naive_store_index"
  output_dir: "Output/{dataset_name}/naiverag/experiment_top_{retrieval_topk}_naive"
  log_file: "Output/{dataset_name}/naiverag/experiment_top_{retrieval_topk}_naive/benchmark.log"

naive_rag:
  chunk_size: 256
  chunk_overlap: 0
  embedding_model: "doubao-embedding-vision-250615"
  api_base: "https://ark.cn-beijing.volces.com/api/v3"
  dimension: 1024
  input_type: "multimodal"
  batch_size: 8
  max_concurrent: 10


llm:
  model: "doubao-seed-2-0-pro-260215"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: ""
